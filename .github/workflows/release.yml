name: Release

# Only ever runs for main, and only after CI has gone green there: a release
# is the one thing that must not race ahead of its own test run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One release at a time — two runs publishing the same version would race.
concurrency: release

permissions:
  contents: write # push the version branch, and the tag when publishing
  pull-requests: write # open and update the release PR
  id-token: write # npm trusted publishing, and provenance

jobs:
  release:
    name: version PR or publish
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit CI passed on, not whatever main looks like now.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # changesets compares against the full history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm does the publishing; this writes the .npmrc that authenticates it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      # With pending changesets: opens or updates a PR that applies them.
      # With none (that PR was merged): publishes and tags. `prepublishOnly`
      # re-runs typecheck, tests and the build before anything leaves the box.
      - uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release:ci
          commit: "release: version packages"
          title: "release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
